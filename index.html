  #veil {
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background:
      radial-gradient(120% 80% at 50% 38%, transparent 30%, rgba(0,0,0,.72) 100%),
      linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,.15) 40%, rgba(0,0,0,.55));
  }
  @keyframes drift { from { transform: scale(1.02); } to { transform: scale(1.09); } }

  /* ── glass ── */
  .glass {
    position: relative;
    background: linear-gradient(145deg, rgba(255,255,255,.075), rgba(255,255,255,.02));
    border: 1px solid var(--edge);
    border-top-color: var(--edge-top);
    border-radius: var(--radius);
    -webkit-backdrop-filter: blur(26px) saturate(140%);
    backdrop-filter: blur(26px) saturate(140%);
    box-shadow: 0 18px 50px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.12), inset 0 0 40px rgba(255,255,255,.015);
  }

  .wrap { width: 100%; max-width: 480px; margin: 0 auto; padding: max(28px, env(safe-area-inset-top)) 18px max(36px, env(safe-area-inset-bottom)); }

  /* ── brand ── */
  .brand { text-align: center; padding: 26px 0 22px; }
  .brand .mark { font-size: 26px; color: rgba(255,255,255,.7); text-shadow: 0 0 22px rgba(255,255,255,.35); }
  .brand h1 {
    margin: 4px 0 2px; font-weight: 300; font-size: 26px; letter-spacing: .5em; padding-left: .5em;
    background: linear-gradient(180deg, #fff, rgba(255,255,255,.45)); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .brand p { margin: 0; font-family: var(--script); font-size: 28px; color: rgba(255,255,255,.6); }

  /* ── gate ── */
  #gate { min-height: 100%; display: grid; place-items: center; transition: opacity .5s ease, transform .5s ease; }
  #gate.leave { opacity: 0; transform: scale(.97); pointer-events: none; }
  .gate-card { padding: 30px 24px 26px; text-align: center; animation: rise .8s cubic-bezier(.2,.8,.2,1) both; }
  .gate-card small { display: block; color: var(--muted); letter-spacing: .28em; text-transform: uppercase; font-size: 11px; margin: 4px 0 22px; }

  /* ── fields ── */
  .field { display: block; text-align: left; }
  .field > span { display: block; font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); margin: 0 4px 8px; }
  input {
    width: 100%; font: inherit; font-size: 17px; color: var(--text);
    padding: 16px 18px; border-radius: 16px; outline: none;
    background: rgba(0,0,0,.38); border: 1px solid var(--edge);
    box-shadow: inset 0 2px 10px rgba(0,0,0,.5);
    transition: border-color .25s, box-shadow .25s, background .25s;
  }
  input::placeholder { color: rgba(255,255,255,.28); }
  input:focus { border-color: rgba(255,255,255,.4); background: rgba(0,0,0,.5); box-shadow: inset 0 2px 10px rgba(0,0,0,.5), 0 0 0 4px rgba(255,255,255,.06); }
  .hint { color: var(--muted); font-size: 12.5px; margin: 9px 4px 0; text-align: left; }

  button { font: inherit; cursor: pointer; border: 0; color: var(--text); }
  .btn {
    width: 100%; margin-top: 16px; padding: 16px 18px; border-radius: 16px;
    font-weight: 600; letter-spacing: .14em; text-transform: uppercase; font-size: 13.5px;
    background: linear-gradient(180deg, rgba(255,255,255,.2), rgba(255,255,255,.06));
    border: 1px solid rgba(255,255,255,.28);
    box-shadow: 0 10px 28px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.35);
    transition: transform .15s ease, background .25s, opacity .25s;
    position: relative; overflow: hidden;
  }
  .btn:hover { background: linear-gradient(180deg, rgba(255,255,255,.27), rgba(255,255,255,.09)); }
  .btn:active { transform: scale(.98); }
  .btn[disabled] { opacity: .65; cursor: progress; }
  .btn.loading::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(100deg, transparent 30%, rgba(255,255,255,.28) 50%, transparent 70%);
    transform: translateX(-100%); animation: sweep 1.1s infinite;
  }
  @keyframes sweep { to { transform: translateX(100%); } }
  .btn.wa { background: linear-gradient(180deg, rgba(56,224,128,.28), rgba(56,224,128,.07)); border-color: rgba(94,242,160,.5); box-shadow: 0 10px 30px rgba(0,0,0,.5), 0 0 32px rgba(56,224,128,.12), inset 0 1px 0 rgba(255,255,255,.3); display: flex; align-items: center; justify-content: center; gap: 10px; }
  .btn.ghost { background: var(--glass); border-color: var(--edge); box-shadow: none; margin-top: 0; letter-spacing: .1em; font-size: 12.5px; }

  .error { margin: 14px 4px 0; color: #ff8aa1; font-size: 14px; text-align: center; min-height: 0; }

  /* ── main ── */
  #app { opacity: 0; transition: opacity .6s ease; }
  #app.show { opacity: 1; }
  .search { padding: 22px 20px 22px; animation: rise .8s cubic-bezier(.2,.8,.2,1) both; }

  #results { display: grid; gap: 12px; margin-top: 16px; }
  .card { padding: 16px 18px; animation: rise .7s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 70ms); }
  .card .k { font-size: 10.5px; letter-spacing: .26em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .card .v { font-size: 16.5px; word-break: break-word; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .card.num .v { font-size: 21px; letter-spacing: .04em; font-variant-numeric: tabular-nums; }

  .card.status { text-align: center; padding: 26px 18px 24px; overflow: hidden; }
  .card.status::before { content: ""; position: absolute; inset: 0; background: radial-gradient(80% 90% at 50% 0%, var(--tint), transparent 70%); opacity: .55; pointer-events: none; }
  .card.status.bad { --tint: rgba(255,93,125,.45); border-color: rgba(255,93,125,.38); }
  .card.status.ok  { --tint: rgba(94,242,160,.38); border-color: rgba(94,242,160,.34); }
  .status .word { font-size: 40px; font-weight: 300; letter-spacing: .34em; padding-left: .34em; margin: 4px 0 6px; }
  .status.bad .word { color: var(--bad); text-shadow: 0 0 30px rgba(255,93,125,.55); }
  .status.ok  .word { color: var(--ok);  text-shadow: 0 0 30px rgba(94,242,160,.5); }
  .status .sub { font-family: var(--hand); font-size: 25px; color: rgba(255,255,255,.78); line-height: 1.2; }
  .status .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 10px; vertical-align: middle; background: currentColor; box-shadow: 0 0 14px currentColor; }

  .note { text-align: center; color: rgba(255,255,255,.34); font-size: 11.5px; margin: 6px 10px 0; line-height: 1.5; }

  /* ── share view ── */
  #share { position: fixed; inset: 0; z-index: 50; background: #000; overflow-y: auto; opacity: 0; transition: opacity .45s ease; }
  #share.show { opacity: 1; }
  #share .inner { max-width: 480px; margin: 0 auto; padding: max(22px, env(safe-area-inset-top)) 18px max(28px, env(safe-area-inset-bottom)); }
  #shareImg { width: 100%; display: block; border-radius: 18px; border: 1px solid rgba(255,255,255,.1); box-shadow: 0 0 60px rgba(255,255,255,.04); }
  .share-actions { display: grid; gap: 10px; margin-top: 18px; }
  .share-actions .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .close { position: sticky; top: 0; margin-left: auto; display: block; width: 40px; height: 40px; border-radius: 50%; background: var(--glass); border: 1px solid var(--edge); font-size: 20px; line-height: 1; margin-bottom: 14px; z-index: 2; }

  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div id="bg"></div><div id="veil"></div>

<!-- Password gate -->
<section id="gate">
  <div class="wrap">
    <div class="brand"><div class="mark">◈</div><h1>OBSIDIAN</h1><p>Vacation Checker</p></div>
    <form id="gateForm" class="glass gate-card" autocomplete="off">
      <small>Restricted access</small>
      <label class="field"><span>Password</span>
        <input id="password" type="password" placeholder="Enter password" autocomplete="current-password" required>
      </label>
      <button id="gateBtn" class="btn" type="submit">Enter</button>
      <div id="gateErr" class="error" hidden></div>
    </form>
  </div>
</section>

<!-- Main -->
<main id="app" hidden>
  <div class="wrap">
    <div class="brand"><div class="mark">◈</div><h1>OBSIDIAN</h1><p>Vacation Checker</p></div>

    <form id="checkForm" class="glass search" autocomplete="off">
      <label class="field"><span>Phone number</span>
        <input id="number" type="tel" inputmode="tel" placeholder="+234 912 781 4853" required>
      </label>
      <div class="hint">Include the country code.</div>
      <button id="checkBtn" class="btn" type="submit">Check</button>
      <div id="checkErr" class="error" hidden></div>
    </form>

    <div id="results" hidden></div>
  </div>
</main>

<!-- Share view -->
<section id="share" hidden>
  <div class="inner">
    <button class="close" id="shareClose" aria-label="Close">×</button>
    <img id="shareImg" alt="Result card">
    <div class="share-actions">
      <button class="btn wa" id="sendWa" style="margin-top:0">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.5 3.5A11.9 11.9 0 0 0 12 0C5.4 0 .1 5.3.1 11.9c0 2.1.6 4.1 1.6 5.9L0 24l6.4-1.7a11.9 11.9 0 0 0 5.6 1.4C18.600 23.700 24 18.400 24 11.800c0-3.200-1.200-6.200-3.500-8.300zM12 21.700c-1.800 0-3.600-.5-5.100-1.400l-.4-.2-3.800 1 1-3.700-.2-.4a9.800 9.800 0 0 1-1.500-5.200C2.100 6.500 6.500 2.100 12 2.100c2.600 0 5.100 1 6.900 2.900a9.700 9.700 0 0 1 2.900 6.900c0 5.400-4.400 9.800-9.800 9.800zm5.400-7.300c-.3-.1-1.700-.8-2-.9-.3-.1-.5-.1-.7.100-.2.300-.8.900-.9 1.100-.2.200-.3.200-.6.100-.3-.1-1.200-.4-2.300-1.400-.8-.8-1.400-1.700-1.600-2-.2-.3 0-.5.100-.6l.4-.5c.1-.2.200-.3.300-.5.100-.2 0-.4 0-.5-.1-.1-.7-1.600-.9-2.200-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.100-.8.400-.3.300-1 1-1 2.500s1.100 2.900 1.200 3.100c.1.200 2.100 3.200 5.100 4.500.7.300 1.300.5 1.700.6.700.2 1.400.2 1.900.1.600-.1 1.700-.7 2-1.400.2-.7.200-1.300.2-1.400-.1-.2-.3-.3-.6-.4z"/></svg>
        <span>Send on WhatsApp</span>
      </button>
      <div class="row">
        <button class="btn ghost" id="sendText">Send as text</button>
        <button class="btn ghost" id="saveImg">Save image</button>
      </div>
    </div>
  </div>
</section>

<script>
/* ════════════════════════════════════════════════════════════
   BACKEND LINK — paste your Render URL between the quotes.
   Example:  const BACKEND_URL = "https://obsidian-checker.onrender.com";
   This value is never shown anywhere on screen.
   ════════════════════════════════════════════════════════════ */
const BACKEND_URL = "https://obsidian-vacation.onrender.com";
/* ════════════════════════════════════════════════════════════ */

const $ = (id) => document.getElementById(id);
let token = null;       // kept in memory only → password is asked every time the app opens
let last = null;        // last result { data, text }

function setBusy(btn, busy, label) {
  btn.disabled = busy;
  btn.classList.toggle('loading', busy);
  if (label) btn.textContent = label;
}
function showErr(el, msg) { el.textContent = msg; el.hidden = !msg; }

async function api(path, body) {
  const base = String(BACKEND_URL || '').trim().replace(/\/+$/, '');
  if (!base) throw new Error('Service unavailable.');
  let res;
  try {
    res = await fetch(base + path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
      body: JSON.stringify(body),
    });
  } catch (_) {
    throw new Error('Cannot reach the server. Check your connection.');
  }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) {
    const err = new Error(data.error || 'Something went wrong.');
    err.status = res.status;
    throw err;
  }
  return data;
}

/* ── password gate ── */
$('gateForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  showErr($('gateErr'), '');
  setBusy($('gateBtn'), true, 'Unlocking…');
  try {
    const out = await api('/api/login', { password: $('password').value });
    token = out.token;
    $('password').value = '';
    $('gate').classList.add('leave');
    setTimeout(() => {
      $('gate').hidden = true;
      $('app').hidden = false;
      requestAnimationFrame(() => $('app').classList.add('show'));
      $('number').focus();
    }, 450);
  } catch (err) {
    showErr($('gateErr'), err.message);
  } finally {
    setBusy($('gateBtn'), false, 'Enter');
  }
});

/* ── results ── */
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}
function infoCard(label, value, extra, i) {
  const c = el('div', 'glass card ' + (extra || ''));
  c.style.setProperty('--i', i);
  c.append(el('div', 'k', label), el('div', 'v', value));
  return c;
}

function renderResult(d) {
  const box = $('results');
  box.replaceChildren();
  let i = 0;

  const s = el('div', 'glass card status ' + (d.banned ? 'bad' : 'ok'));
  s.style.setProperty('--i', i++);
  const k = el('div', 'k', 'Status');
  const w = el('div', 'word');
  w.append(el('span', 'dot'), document.createTextNode(d.plainStatus));
  const sub = el('div', 'sub', d.banned ? 'Obsidian sent this user — ' + d.vacationLine.toLowerCase() : 'No restriction found');
  s.append(k, w, sub);
  box.append(s);

  box.append(infoCard('Number', d.number, 'num', i++));
  box.append(infoCard('Reason', d.reason, '', i++));
  const g = el('div', 'grid2');
  g.append(infoCard('Permanence / Type', d.permanence, '', i++), infoCard('Banned at', d.bannedAt, '', i++));
  box.append(g);
  box.append(infoCard('Review', d.review, '', i++));
  box.append(infoCard('Checked', d.checkedAt, '', i++));

  const share = el('button', 'btn wa');
  share.type = 'button';
  share.style.marginTop = '4px';
  share.innerHTML = $('sendWa').querySelector('svg').outerHTML + '<span>Share to WhatsApp</span>';
  share.addEventListener('click', openShare);
  box.append(share);
  box.append(el('div', 'note', 'Results depend on the checker service. Invalid or missing fields are not independently verified.'));
  box.hidden = false;
}

$('checkForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  showErr($('checkErr'), '');
  setBusy($('checkBtn'), true, 'Checking…');
  try {
    const out = await api('/api/check', { number: $('number').value });
    last = out;
    renderResult(out.data);
    $('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
  } catch (err) {
    if (err.status === 401) {
      token = null; last = null;
      $('results').hidden = true;
      $('app').classList.remove('show'); $('app').hidden = true;
      $('gate').hidden = false; $('gate').classList.remove('leave');
      showErr($('gateErr'), err.message);
    } else {
      showErr($('checkErr'), err.message);
    }
  } finally {
    setBusy($('checkBtn'), false, 'Check');
  }
});

/* ── share image (deep black · handwritten glass text) ── */
function glassText(ctx, text, x, y, font, align, size, tint) {
  ctx.save();
  ctx.font = font; ctx.textAlign = align; ctx.textBaseline = 'alphabetic';
  const g = ctx.createLinearGradient(0, y - size, 0, y + size * 0.25);
  const t = tint || '255,255,255';
  g.addColorStop(0, `rgba(${t},0.92)`);
  g.addColorStop(1, `rgba(${t},0.28)`);
  ctx.shadowColor = `rgba(${t},0.28)`; ctx.shadowBlur = 18;
  ctx.fillStyle = g; ctx.fillText(text, x, y);
  ctx.shadowBlur = 0;
  ctx.lineWidth = 1.4; ctx.strokeStyle = `rgba(${t},0.55)`; ctx.strokeText(text, x, y);
  ctx.restore();
}
function wrap(ctx, text, maxW) {
  const words = String(text).split(' '); const lines = []; let cur = '';
  for (const w of words) {
    const t = cur ? cur + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t;
  }
  if (cur) lines.push(cur);
  return lines;
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

async function buildImage(d) {
  try {
    await Promise.all([document.fonts.load('700 60px Caveat'), document.fonts.load('500 40px Caveat'), document.fonts.load('120px "Great Vibes"')]);
  } catch (_) {}
  const W = 1080, PAD = 90, IW = W - PAD * 2;
  const scratch = document.createElement('canvas'); scratch.width = W; scratch.height = 2400;
  const c = scratch.getContext('2d');
  c.fillStyle = '#000'; c.fillRect(0, 0, W, 2400);

  const HAND = '"Caveat", "Segoe Script", cursive';
  const SCRIPT = '"Great Vibes", "Segoe Script", cursive';
  const tint = d.banned ? '255,110,140' : '120,255,175';
  let y = 60;

  // glass frame
  const frameTop = 40;
  // title
  glassText(c, 'Obsidian', W / 2, y + 150, `140px ${SCRIPT}`, 'center', 140);
  y += 200;
  glassText(c, 'Vacation Checker', W / 2, y + 40, `500 50px ${HAND}`, 'center', 50);
  y += 100;

  // status
  glassText(c, d.plainStatus === 'BANNED' ? 'Banned' : 'Active', W / 2, y + 120, `700 150px ${HAND}`, 'center', 150, tint);
  y += 160;
  c.font = `500 46px ${HAND}`;
  const sub = d.banned ? 'Obsidian sent this user — ' + d.vacationLine.toLowerCase() : 'No restriction found';
  for (const line of wrap(c, sub, IW)) { glassText(c, line, W / 2, y + 40, `500 46px ${HAND}`, 'center', 46); y += 56; }
  y += 40;

  const rows = [
    ['Number', d.number],
    ['Reason', d.reason],
    ['Permanence / Type', d.permanence],
    ['Review', d.review],
    ['Banned at', d.bannedAt],
  ];
  for (const [label, value] of rows) {
    c.font = `700 56px ${HAND}`;
    const lines = wrap(c, value, IW);
    const h = 40 + 44 + lines.length * 64 + 28;
    c.save();
    roundRect(c, PAD - 30, y, IW + 60, h, 34);
    c.fillStyle = 'rgba(255,255,255,0.035)'; c.fill();
    c.lineWidth = 1.5; c.strokeStyle = 'rgba(255,255,255,0.16)'; c.stroke();
    c.restore();
    glassText(c, label, PAD, y + 62, `500 38px ${HAND}`, 'left', 38);
    c.globalAlpha = 1;
    let ly = y + 62 + 28;
    for (const line of lines) { ly += 62; glassText(c, line, PAD, ly - 8, `700 56px ${HAND}`, 'left', 56); }
    y += h + 26;
  }

  y += 20;
  glassText(c, '◈  Obsidian  ◈', W / 2, y + 60, `70px ${SCRIPT}`, 'center', 70);
  y += 120;

  const out = document.createElement('canvas'); out.width = W; out.height = y;
  out.getContext('2d').drawImage(scratch, 0, 0, W, y, 0, 0, W, y);
  return out;
}

let shareBlob = null;
async function openShare() {
  if (!last) return;
  const canvas = await buildImage(last.data);
  shareBlob = await new Promise((r) => canvas.toBlob(r, 'image/png'));
  $('shareImg').src = canvas.toDataURL('image/png');
  $('share').hidden = false;
  requestAnimationFrame(() => $('share').classList.add('show'));
  document.body.style.overflow = 'hidden';
}
function closeShare() {
  $('share').classList.remove('show');
  setTimeout(() => { $('share').hidden = true; document.body.style.overflow = ''; }, 350);
}
$('shareClose').addEventListener('click', closeShare);

function openWaText() {
  window.open('https://wa.me/?text=' + encodeURIComponent(last.text), '_blank');
}
$('sendText').addEventListener('click', () => { if (last) openWaText(); });

$('sendWa').addEventListener('click', async () => {
  if (!last) return;
  try {
    if (shareBlob && navigator.canShare) {
      const file = new File([shareBlob], 'obsidian-check.png', { type: 'image/png' });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], text: last.text });
        return;
      }
    }
  } catch (err) {
    if (err && err.name === 'AbortError') return;
  }
  openWaText();   // fallback: same text straight into WhatsApp
});

$('saveImg').addEventListener('click', () => {
  if (!shareBlob) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(shareBlob);
  a.download = 'obsidian-check.png';
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
});
</script>
</body>
